# Keeps the SDK current with the API: daily, and when run by hand,
# scripts/update.sh moves it to the head of origincloudhq/api and generates
# it again. When that changes anything, the result is one pull request from
# the branch `regenerate`, refreshed by each later run until it is merged;
# when it changes nothing, an open one is closed.
#
# Commits someone adds to that pull request, such as a new service's
# package, are kept: a later run generates on top of them, with main merged
# in, and never closes a pull request that has them. Merging main resolves
# conflicts in what scripts/update.sh writes again anyway (API_REVISION and
# the *.pb.go files); any other conflict fails the run until someone merges
# main into the branch by hand.
#
# The pull request also sets the next version (scripts/version.sh bump): a
# minor version when the API moved, a patch otherwise. Once CI passes on it,
# merge-regeneration.yml merges a pull request that holds only this
# workflow's commits, and release.yml tags the version (RELEASING.md).
#
# It runs when origincloudhq/api changes (mono's export dispatches it), and
# daily as a fallback.
#
# With the regeneration App configured (the variable REGENERATE_APP_ID and
# the secret REGENERATE_APP_PRIVATE_KEY), the branch is pushed and the pull
# request opened with the App's token, so that CI runs on the pull request,
# and its merge starts the release. Without it, the workflow token opens the
# pull request, which starts no pull_request run, so this dispatches CI on
# the branch; its result shows on the pull request's commit, and the pull
# request is merged by hand. Opening it with the workflow token needs "Allow
# GitHub Actions to create and approve pull requests" in the repository's
# Actions settings.
name: Regenerate

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: regenerate
    steps:
      - name: App token
        id: app
        if: vars.REGENERATE_APP_ID != ''
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: ${{ vars.REGENERATE_APP_ID }}
          private-key: ${{ secrets.REGENERATE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: 'actions/checkout@v4'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      # The open pull request's branch, when someone has added commits to
      # it, with main merged in; main otherwise.
      - name: Base
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          echo "PREVIOUS=$(cat API_REVISION)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bot="$(git config user.email)"
          base=main
          lease=""
          # Exit status 2: there is no such branch. Any other failure fails
          # the run rather than passing for an absent branch.
          found=0
          git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null || found=$?
          if [[ "${found}" -eq 0 ]]; then
            git fetch --quiet origin "${BRANCH}"
            lease="$(git rev-parse FETCH_HEAD)"
            open="$(gh pr list --head "${BRANCH}" --base main --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not))[0].number // empty')"
            # Committers too: an amended or rebased commit of the workflow's
            # keeps it as the author.
            added="$(git log --format='%ae%n%ce' origin/main..FETCH_HEAD | grep -cvxF "${bot}" || true)"
            if [[ -n "${open}" && "${added}" -gt 0 ]]; then
              git switch --quiet -C "${BRANCH}" FETCH_HEAD
              if ! git merge --quiet --no-edit origin/main; then
                for path in $(git diff --name-only --diff-filter=U); do
                  case "${path}" in
                    internal/*) ;;
                    API_REVISION | *.pb.go)
                      if git checkout --quiet --ours -- "${path}" 2>/dev/null; then
                        git add -- "${path}"
                      else
                        git rm --quiet -- "${path}"
                      fi
                      ;;
                  esac
                done
                conflicts="$(git diff --name-only --diff-filter=U | paste -sd ' ' -)"
                if [[ -n "${conflicts}" ]]; then
                  echo "::error::merging main into ${BRANCH} conflicts in ${conflicts}: merge main into it by hand and push"
                  exit 1
                fi
                git commit --quiet --no-edit
              fi
              base=branch
            fi
          elif [[ "${found}" -ne 2 ]]; then
            echo "::error::could not read origin's branches"
            exit 1
          fi
          {
            echo "BASE=${base}"
            echo "LEASE=${lease}"
            echo "FROM=$(cat API_REVISION)"
          } >> "$GITHUB_ENV"

      - name: Go
        uses: 'actions/setup-go@v5'
        with:
          go-version-file: go.mod

      - name: Update
        run: |
          set -euo pipefail
          scripts/update.sh
          # The next version, in the same pull request: minor when the API
          # moved, patch for a change of the generator alone.
          if [[ -n "$(git status --porcelain)" || "${BASE}" == branch ]]; then
            if [[ "$(cat API_REVISION)" != "$(git show origin/main:API_REVISION)" ]]; then
              scripts/version.sh bump minor
            else
              scripts/version.sh bump patch
            fi
          fi

      - name: Pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          WITH_APP: ${{ steps.app.outputs.token != '' }}
        run: |
          set -euo pipefail
          open="$(gh pr list --head "${BRANCH}" --base main --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not))[0].number // empty')"
          if [[ "${BASE}" == main && -z "$(git status --porcelain)" ]]; then
            echo "already current"
            # The branch goes only as the Base step found it, and its pull
            # request closes with it; one pushed to meanwhile stays.
            if [[ -n "${LEASE}" ]]; then
              if git push --quiet --force-with-lease="${BRANCH}:${LEASE}" origin ":${BRANCH}"; then
                if [[ -n "${open}" ]]; then
                  gh pr comment "${open}" --body "main is current with the API."
                fi
              else
                echo "::warning::${BRANCH} changed during the run; left as it is"
              fi
            fi
            exit 0
          fi

          revision="$(cat API_REVISION)"
          git switch --quiet -C "${BRANCH}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git commit --quiet -m "Regenerate from origincloudhq/api@${revision:0:12}" \
              -m "API: https://github.com/origincloudhq/api/compare/${FROM}...${revision}"
          fi

          # Unchanged since the last run: nothing to push or check again.
          if [[ -n "${LEASE}" ]] && git diff --quiet "${LEASE}" HEAD; then
            echo "pull request #${open:-?} is current"
            exit 0
          fi
          # Replaces the branch only as this run found it: a commit pushed
          # meanwhile fails the run instead of being lost.
          git push --quiet --force-with-lease="${BRANCH}:${LEASE}" origin "${BRANCH}"

          body="Generated from [origincloudhq/api@${revision:0:12}](https://github.com/origincloudhq/api/commit/${revision}) ([changes](https://github.com/origincloudhq/api/compare/${PREVIOUS}...${revision})) by scripts/update.sh.

          A service new to the API gets its package generated (<service>/<version>/): add a test of its client and a row in README.md's table on this branch before merging.

          If CI fails, the API uses something the generator (internal/cmd/protoc-gen-go-origincloud) doesn't support yet; extend it on this branch."
          if [[ -n "${open}" ]]; then
            gh pr edit "${open}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "Regenerate from the latest API" --body "${body}"
          fi
          # The App's push starts CI on the pull request; the workflow
          # token's doesn't.
          if [[ "${WITH_APP}" != true ]]; then
            gh workflow run ci.yml --ref "${BRANCH}"
          fi
